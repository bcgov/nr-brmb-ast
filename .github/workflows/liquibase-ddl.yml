name: Liquibase DDL application
run-name: Deploy Liquibase to ${{ inputs.ENVIRONMENT_NAME }}

on:
  workflow_dispatch:
    inputs:
      # GitHub always preselects the first choice option, so each list starts with a
      # placeholder that the validate-inputs job rejects - forces an explicit selection.
      ENVIRONMENT_NAME:
        required: true
        type: choice
        options:
          - "-- select --"
          - dev
          - dlvr
          - test
          - prod
      NAMESPACE:
        required: true
        type: choice
        options:
          - "-- select --"
          - e980f4-dev
          - e980f4-test
          - e980f4-prod
      TAG:
        required: true
        type: string

jobs:
  # Rejects any input left on its "-- select --" placeholder or blank. Runs as a separate
  # job so a bad ENVIRONMENT_NAME fails before ddl_dockerbuild references it as a GitHub environment.
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unselected or empty inputs
        env:
          ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
          NAMESPACE: ${{ inputs.NAMESPACE }}
          TAG: ${{ inputs.TAG }}
        run: |
          FAILED=0
          for NAME in ENVIRONMENT_NAME NAMESPACE TAG; do
            VALUE="${!NAME}"
            if [ -z "${VALUE// /}" ] || [ "$VALUE" == "-- select --" ]; then
              echo "::error::$NAME must be selected/entered."
              FAILED=1
            fi
          done
          exit $FAILED

  ddl_dockerbuild:
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT_NAME }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta_pr
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY}}/${{ github.repository_owner }}/farms-liquibase
          tags: |
            type=schedule
            type=raw,value=${{ github.base_ref }}
            type=ref,event=tag
            type=raw,value=${{ inputs.TAG }}
            ${{ toJson(github.event.pull_request.number) == '{}' && format( 'type=raw,value=pr-{0}', github.event.pull_request.number) || '' }} 


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./farms-liquibase
          push: true
          tags: ${{ steps.meta_pr.outputs.tags }}
          labels: ${{ steps.meta_pr.outputs.labels }}
  

  ddl_deploy:
    needs: ddl_dockerbuild 
    uses: ./.github/workflows/openshift-deploy.yml
    secrets: inherit
    with:
      MICROSERVICE_NAME: farms-liquibase
      ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
      NAMESPACE: ${{ inputs.NAMESPACE }}
      TAG: ${{ inputs.TAG }}
      
