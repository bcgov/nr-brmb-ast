name: load test
run-name: Load test ${{ inputs.MICROSERVICE_NAME }} in ${{ inputs.ENVIRONMENT_NAME }}

on:
  workflow_dispatch:
    inputs:
      # GitHub always preselects the first choice option, so each list starts with a
      # placeholder that the validate-inputs job rejects - forces an explicit selection.
      MICROSERVICE_NAME:
        required: true
        type: choice
        options:
          - "-- select --"
          - farms-api
      ENVIRONMENT_NAME:
        required: true
        type: choice
        options:
          - "-- select --"
          - dev
          - dlvr
          - test
          - prod

jobs:
  # Rejects any input left on its "-- select --" placeholder. Runs as a separate job so a bad
  # ENVIRONMENT_NAME fails before the build job references it as a GitHub environment.
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unselected inputs
        env:
          MICROSERVICE_NAME: ${{ inputs.MICROSERVICE_NAME }}
          ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
        run: |
          FAILED=0
          for NAME in MICROSERVICE_NAME ENVIRONMENT_NAME; do
            VALUE="${!NAME}"
            if [ -z "${VALUE// /}" ] || [ "$VALUE" == "-- select --" ]; then
              echo "::error::$NAME must be selected."
              FAILED=1
            fi
          done
          exit $FAILED

  build:
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT_NAME }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install JMeter
        run: |
          wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter
        run: |
          apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t load-tests/${{ inputs.MICROSERVICE_NAME }}-load-test.jmx \
            -Jtenant_id=${{ secrets.TENANT_ID }} \
            -Jclient_id=${{ secrets.CLIENT_ID }} \
            -Jclient_secret=${{ secrets.CLIENT_SECRET }} \
            -Jhost=${{ vars.API_HOST }} \
            -Jthreads=1 \
            -l results.csv

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results.csv
          if-no-files-found: error
