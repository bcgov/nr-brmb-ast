name: Openshift DB deploy/update
run-name: Deploy PostgresCluster to ${{ inputs.ENVIRONMENT_NAME}}

on:
  workflow_dispatch:
    inputs:
      # GitHub always preselects the first choice option, so each list starts with a
      # placeholder that the validate-inputs job rejects - forces an explicit selection.
      ENVIRONMENT_NAME:
        required: true
        type: choice
        options:
          - "-- select --"
          - dev
          - dlvr
          - test
          - prod
          - tools

jobs:
  # Rejects any input left on its "-- select --" placeholder. Runs as a separate job so a bad
  # ENVIRONMENT_NAME fails before the build job references it as a GitHub environment.
  # Also derives the OpenShift namespace from ENVIRONMENT_NAME (dlvr shares the dev namespace).
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      NAMESPACE: ${{ steps.namespace.outputs.NAMESPACE }}
    steps:
      - name: Reject unselected inputs
        env:
          ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
        run: |
          FAILED=0
          for NAME in ENVIRONMENT_NAME; do
            VALUE="${!NAME}"
            if [ -z "${VALUE//[[:space:]]/}" ] || [ "$VALUE" == "-- select --" ]; then
              echo "::error::$NAME must be selected."
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Derive namespace from environment
        id: namespace
        env:
          ENVIRONMENT_NAME: ${{ inputs.ENVIRONMENT_NAME }}
        run: |
          case "$ENVIRONMENT_NAME" in
            dev|dlvr) NAMESPACE=e980f4-dev ;;
            test)     NAMESPACE=e980f4-test ;;
            prod)     NAMESPACE=e980f4-prod ;;
            tools)    NAMESPACE=e980f4-tools ;;
            *)
              echo "::error::No namespace known for ENVIRONMENT_NAME '$ENVIRONMENT_NAME'."
              exit 1
              ;;
          esac
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENVIRONMENT_NAME }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: copy crunchydb files
        run: mkdir staging && cp -r crunchy-postgres/charts/crunchy-postgres staging/crunchy-postgres
      
      - name: Fill properties files
        uses: cschleiden/replace-tokens@v1.3
        with:
          files: staging/**/*
        env:
          LICENSE_PLATE: 'e980f4'
          #Vault path is different for prod than all other environments
          VAULT_RESOURCE: ${{ needs.validate-inputs.outputs.NAMESPACE == 'e980f4-prod' && 'prod' || 'nonprod'  }}        
          ENV: ${{ inputs.ENVIRONMENT_NAME }}
          DB_STORAGE: ${{ vars.DB_STORAGE }}
          DB_MAX_CPU: ${{ vars.DB_MAX_CPU }}
          DB_MAX_MEMORY: ${{ vars.DB_MAX_MEMORY}}
          DB_REPLICAS: ${{ vars.DB_INSTANCE_HA_REPLICAS }}
          DB_BACKUP_VOLUME_SIZE: ${{ vars.DB_BACKUP_VOLUME_SIZE }}
          BOUNCER_REPLICAS: ${{ vars.DB_LOADBALANCER_HA_REPLICAS}}
          S3_ENVIRONMENT: ${{ inputs.ENVIRONMENT_NAME == 'tools' && 'dev' || (inputs.ENVIRONMENT_NAME == 'dlvr' && 'dev' || (inputs.ENVIRONMENT_NAME == 'test' && 'tst' || (inputs.ENVIRONMENT_NAME == 'prod' && 'prd' || inputs.ENVIRONMENT_NAME))) }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
      
      - name: install helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      #Explicit install of oc cli tool
      - name: Install oc
        uses: redhat-actions/oc-installer@v1

      - name: Authenticate and set context
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{secrets.openshift_server_url}}
          openshift_token: ${{secrets.openshift_token}}
          namespace: ${{ needs.validate-inputs.outputs.NAMESPACE }}

      - name: zip and install helm chart
        run: |
          cd staging && tar -czvf crunchy-postgres.tar.gz crunchy-postgres
          export STATUS_OUT=$(helm status crunchy-postgres-${{inputs.ENVIRONMENT_NAME}} 2>&1 >/dev/null)
          if [[ $STATUS_OUT == *"not found"* ]]; then
            echo "Attempting helm install"
            helm install crunchy-postgres-${{inputs.ENVIRONMENT_NAME}} ./crunchy-postgres.tar.gz
            exit 0
          else
            echo "Attempting helm upgrade"
            helm upgrade crunchy-postgres-${{inputs.ENVIRONMENT_NAME}} ./crunchy-postgres.tar.gz
            exit 0
          fi
